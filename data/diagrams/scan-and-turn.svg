<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Helvetica, Arial, sans-serif">
<title>Scan and turn</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffd400"/></marker>
</defs>
<rect width="800" height="600" fill="#3a7d44"/>
<rect x="320" y="220" width="160" height="160" fill="#4a9255" stroke="#fff" stroke-width="3"/><path d="M320,211 L329,228 L311,228 z" fill="#ff8c1a" stroke="#fff" stroke-width="1.5"/><path d="M480,211 L489,228 L471,228 z" fill="#ff8c1a" stroke="#fff" stroke-width="1.5"/><path d="M320,371 L329,388 L311,388 z" fill="#ff8c1a" stroke="#fff" stroke-width="1.5"/><path d="M480,371 L489,388 L471,388 z" fill="#ff8c1a" stroke="#fff" stroke-width="1.5"/><path d="M495,220 L505,220 L505,380 L495,380" fill="none" stroke="#fff" stroke-width="3"/><text x="515" y="307.0" text-anchor="start" font-size="22" font-weight="bold" fill="#fff">4 yd</text><circle cx="400" cy="55" r="16" fill="#1e6fd9" stroke="#fff" stroke-width="2"/><circle cx="400" cy="95" r="16" fill="#1e6fd9" stroke="#fff" stroke-width="2"/><text x="370" y="80" text-anchor="end" font-size="20" font-weight="bold" fill="#fff">Receivers</text><path d="M400,118 L400,232" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#ah)"/><text x="385" y="160" text-anchor="end" font-size="18" font-weight="bold" fill="#fff">1. run in, then</text><text x="385" y="182" text-anchor="end" font-size="18" font-weight="bold" fill="#fff">look over shoulder</text><circle cx="400" cy="255" r="16" fill="#1e6fd9" stroke="#fff" stroke-width="2"/><text x="400" y="261" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">R</text><circle cx="500" cy="80" r="16" fill="#222" stroke="#fff" stroke-width="2"/><text x="500" y="86" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">C</text><text x="500" y="122" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">Coach</text><text x="535" y="76" text-anchor="start" font-size="18" font-weight="bold" fill="#fff">2. points ahead or</text><text x="535" y="98" text-anchor="start" font-size="18" font-weight="bold" fill="#fff">to a side, drops arm</text><circle cx="400" cy="520" r="16" fill="#e8a400" stroke="#fff" stroke-width="2"/><text x="400" y="526" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">P</text><circle cx="428" cy="520" r="7" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="400" cy="560" r="16" fill="#e8a400" stroke="#fff" stroke-width="2"/><circle cx="428" cy="560" r="7" fill="#fff" stroke="#222" stroke-width="2"/><text x="370" y="540" text-anchor="end" font-size="20" font-weight="bold" fill="#fff">Passers (balls)</text><path d="M400,495 L400,285" fill="none" stroke="#ffd400" stroke-width="4" marker-end="url(#ay)"/><text x="415" y="478" text-anchor="start" font-size="18" font-weight="bold" fill="#fff">3. pass when arm drops</text><path d="M375,255 L338,255" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#ah)"/><path d="M425,255 L462,255" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#ah)"/><text x="308" y="250" text-anchor="end" font-size="18" font-weight="bold" fill="#fff">To a side:</text><text x="308" y="272" text-anchor="end" font-size="18" font-weight="bold" fill="#fff">turn that way</text><path d="M425,300 C455,345 455,390 425,430" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#ah)"/><text x="470" y="350" text-anchor="start" font-size="18" font-weight="bold" fill="#fff">Ahead: pass back</text><text x="470" y="372" text-anchor="start" font-size="18" font-weight="bold" fill="#fff">to passer</text></svg>
