<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 630" width="800" height="630" font-family="Helvetica, Arial, sans-serif">
<title>1v1 on turn</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffd400"/></marker>
</defs>
<rect width="800" height="630" fill="#3a7d44"/>
<rect x="130" y="100" width="140" height="26" fill="none" stroke="#fff" stroke-width="4"/><text x="200.0" y="152" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">Goal</text><rect x="530" y="100" width="140" height="26" fill="none" stroke="#fff" stroke-width="4"/><text x="600.0" y="152" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">Goal</text><circle cx="400" cy="40" r="16" fill="#1e6fd9" stroke="#fff" stroke-width="2"/><circle cx="400" cy="76" r="16" fill="#1e6fd9" stroke="#fff" stroke-width="2"/><text x="430" y="52" text-anchor="start" font-size="16" font-weight="bold" fill="#fff">Attack/</text><text x="430" y="72" text-anchor="start" font-size="16" font-weight="bold" fill="#fff">defense line</text><circle cx="400" cy="112" r="16" fill="#1e6fd9" stroke="#fff" stroke-width="2"/><text x="400" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">D</text><circle cx="400" cy="187" r="16" fill="#d93a2f" stroke="#fff" stroke-width="2"/><text x="400" y="193" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">A</text><path d="M375,112 L365,112 L365,187 L375,187" fill="none" stroke="#fff" stroke-width="3"/><text x="355" y="157" text-anchor="end" font-size="22" font-weight="bold" fill="#fff">5 yd</text><path d="M70,126 L60,126 L60,425 L70,425" fill="none" stroke="#fff" stroke-width="3"/><text x="48" y="275" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff" transform="rotate(-90 48 275)">20 yd</text><circle cx="400" cy="425" r="16" fill="#e8a400" stroke="#fff" stroke-width="2"/><text x="400" y="431" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">P</text><circle cx="428" cy="425" r="7" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="400" cy="467" r="16" fill="#e8a400" stroke="#fff" stroke-width="2"/><circle cx="428" cy="467" r="7" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="400" cy="509" r="16" fill="#e8a400" stroke="#fff" stroke-width="2"/><circle cx="428" cy="509" r="7" fill="#fff" stroke="#222" stroke-width="2"/><text x="450" y="432" text-anchor="start" font-size="20" font-weight="bold" fill="#fff">Passers (balls)</text><path d="M390,214 L390,395" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#ah)"/><text x="380" y="310" text-anchor="end" font-size="18" font-weight="bold" fill="#fff">1. check to ball</text><path d="M368,175 C300,170 240,165 215,142" fill="none" stroke="#ffd400" stroke-width="4" marker-end="url(#ay)"/><path d="M432,175 C500,170 560,165 585,142" fill="none" stroke="#ffd400" stroke-width="4" marker-end="url(#ay)"/><text x="300" y="215" text-anchor="end" font-size="18" font-weight="bold" fill="#fff">2. turn and shoot</text><text x="300" y="237" text-anchor="end" font-size="18" font-weight="bold" fill="#fff">at either goal</text><text x="400" y="560" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">Defender tries to win the ball and clear it</text><text x="400" y="595" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">A = attacker, D = defender, P = passer.  Rotate: A fetches ball, joins passers; P joins attack/defense; D becomes A.</text></svg>
